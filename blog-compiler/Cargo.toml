[package]
name = "blog-compiler"
version = "0.1.0"
edition = "2024"
description = "A Markdown compiler for the Wael El Oraiby portfolio and blog"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
maud = "0.27"
percent-encoding = "2"
pulldown-cmark = "0.13"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
